[metadata]
name = tt-opbench
version = 0.1.0
description = Small Tenstorrent-first experiment harness for operator-level optimization studies.
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    numpy>=1.24

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    tt-opbench-cpu-matmul = tt_opbench.cpu_matmul:main
    tt-opbench-ttnn-matmul = tt_opbench.ttnn_matmul:main
