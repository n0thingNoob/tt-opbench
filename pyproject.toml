[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tt-opbench"
version = "0.1.0"
description = "Small Tenstorrent-first experiment harness for operator-level optimization studies."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.scripts]
tt-opbench-cpu-matmul = "tt_opbench.cpu_matmul:main"
tt-opbench-ttnn-matmul = "tt_opbench.ttnn_matmul:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
